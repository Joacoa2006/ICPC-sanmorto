name: Build ICPC notebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Compile templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile every C++ file
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Compiling $file"
            g++ -std=gnu++17 -O2 -pipe -c "$file" -o /tmp/template.o
          done < <(find . -type f -name '*.cpp' -print0)

  notebook:
    name: Generate PDF notebook
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: python -m pip install --upgrade pip reportlab pygments

      - name: Generate notebook PDF
        run: |
          python generar_notebook_icpc.py . \
            -o ICPC-sanmorto.pdf \

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ICPC-sanmorto-notebook
          path: ICPC-sanmorto.pdf
          if-no-files-found: error
          retention-days: 30
